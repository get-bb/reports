<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>  .bb-sidebar-hover-actions {
    pointer-events: none;
    opacity: 0;
    transition-property: opacity;
    transition-duration: 0ms;
  }

  .bb-sidebar-hover-actions-row:is(:hover, :has(:focus-visible))
    .bb-sidebar-hover-actions,
  .bb-sidebar-hover-actions[data-sidebar-hover-actions-open="true"] {
    pointer-events: auto;
    opacity: 1;
  }

  /* Sidebar row glyph that swaps on hover (the Extensions row's toolbox ->
   * tool case). Both glyphs share one grid cell and only opacity changes, so
   * the row can never reflow mid-swap. Driven by the same
   * :is(:hover, :has(:focus-visible)) row selector as the hover actions above,
   * so a keyboard focus swaps the glyph exactly like a pointer hover. */
  .bb-sidebar-row-icon-swap {
    display: grid;
    grid-template-areas: "glyph";
  }

  .bb-sidebar-row-icon-swap > * {
    grid-area: glyph;
  }

  .bb-sidebar-row-icon-hover {
    opacity: 0;
  }

  .bb-sidebar-hover-actions-row:is(:hover, :has(:focus-visible))
    .bb-sidebar-row-icon-rest {
    opacity: 0;
  }

  .bb-sidebar-hover-actions-row:is(:hover, :has(:focus-visible))
    .bb-sidebar-row-icon-hover {
    opacity: 1;
  }

  /* Row content beside a hover-actions overlay that grows past its rest slot
   * (the thread row's archive button sits left of the menu trigger). Reserve
   * one action width under the same row states that reveal the overlay, so the
   * title truncates instead of running under the button. */
  .bb-sidebar-hover-actions-inset {
    transition-property: padding;
    transition-duration: 0ms;
  }

  .bb-sidebar-hover-actions-row:is(:hover, :has(:focus-visible))
    .bb-sidebar-hover-actions-inset,
  .bb-sidebar-hover-actions-row:has(
      .bb-sidebar-hover-actions[data-sidebar-hover-actions-open="true"]
    )
    .bb-sidebar-hover-actions-inset {
    padding-right: 1.5rem;
  }

  .bb-sidebar-hover-actions-fade {
    opacity: 1;
    transition-property: opacity;
    transition-duration: 0ms;
  }

  .bb-sidebar-hover-actions-row:is(:hover, :has(:focus-visible))
    .bb-sidebar-hover-actions-fade,
  .bb-sidebar-hover-actions-fade[data-sidebar-hover-actions-open="true"] {
    opacity: 0;
  }

  @media (max-width: 767px) and (pointer: coarse) {
    /* The overlay is hidden on coarse phones, so no room is reserved. */
    .bb-sidebar-hover-actions-row .bb-sidebar-hover-actions-inset {
      padding-right: 0;
    }

    .bb-sidebar-hover-actions-row:hover:not(:has(:focus-visible))
      .bb-sidebar-hover-actions:not(
        [data-sidebar-hover-actions-open="true"]
      ):not([data-sidebar-hover-actions-mobile="always"]) {
      pointer-events: none;
      opacity: 0;
    }

    .bb-sidebar-hover-actions-row:hover:not(:has(:focus-visible))
      .bb-sidebar-hover-actions-fade:not(
        [data-sidebar-hover-actions-open="true"]
      ) {
      opacity: 1;
    }

    .bb-sidebar-hover-actions[data-sidebar-hover-actions-mobile="always"] {
      pointer-events: auto;
      opacity: 1;
    }
  }


body{font:16px system-ui;margin:24px;background:#fafaf8;color:#1a1a1a}section{border:1px solid #ccc;padding:16px}button{font:inherit;padding:8px}.bb-sidebar-hover-actions-row{display:flex;align-items:center;justify-content:space-between;gap:8px}</style></head><body><h1>Project header probe</h1><p>Isolated production wrapper and hover CSS. Simplified label and button.</p><section class="bb-sidebar-hover-actions-row"><strong>QA project</strong><span data-sidebar-hover-actions-mobile="always" class="bb-sidebar-hover-actions"><button aria-label="Display options" id="display">Display options</button></span></section><p id="result">No tap received</p><script>document.querySelector("#display").onclick=()=>document.querySelector("#result").textContent="Tap received";</script></body></html>
